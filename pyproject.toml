[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinit-scratch-interview-lm"
version = "0.1.0"
description = "Feasibility scaffold for a compact language model trained from random initialization."
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

